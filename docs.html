<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatrickStar — REST API Docs</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" title="Menu">
      <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
    <div class="logo">Patrick<span>Star</span> Docs</div>
  </div>
</div>

<!-- DROPDOWN -->
<div class="dropdown" id="dropdown">
  <a class="dropdown-item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Dashboard
  </a>
  <a class="dropdown-item" href="docs.html">
    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
    REST API Docs
  </a>
</div>

<div class="container">
  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Kembali
  </a>

  <div class="title-block">
    <h1>
      <span class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        REST API Docs
      </span>
    </h1>
    <p>Integrasikan Spam OTP ke Website, Bot, atau APK lu.</p>
  </div>

  <div class="form-group">
    <label>Nomor Target</label>
    <input class="form-input" type="tel" id="phoneInput" placeholder="Contoh: 628123456789" maxlength="15">
  </div>

  <div class="form-group">
    <label>Key</label>
    <input class="form-input" type="text" id="keyInput" placeholder="Masukkan Key lu...">
  </div>

  <!-- LANG TABS -->
  <div class="lang-tabs">
    <button class="lang-tab" data-lang="curl">cURL</button>
    <button class="lang-tab" data-lang="javascript">JavaScript</button>
    <button class="lang-tab" data-lang="python">Python</button>
    <button class="lang-tab" data-lang="php">PHP</button>
    <button class="lang-tab active" data-lang="nodejs">Node.js</button>
  </div>

  <!-- CODE BLOCK -->
  <div class="code-block">
    <div class="code-header">
      <span id="codeLangLabel">Node.js</span>
      <button class="copy-btn" id="copyBtn">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        COPY
      </button>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>

  <button class="btn-primary" id="submitBtn">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    Submit Query
  </button>

  <div class="total-bar">
    <span>Total Request API OTP</span>
    <span class="count" id="totalCount">0</span>
  </div>
</div>

<div class="footer">PatrickStar Spam OTP &middot; API Key: Patrick</div>

<script src="js/endpoints.js"></script>
<script src="js/docs.js"></script>
</body>
</html>
